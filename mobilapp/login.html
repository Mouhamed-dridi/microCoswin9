<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MicoFix - Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="container">
        <header>
            <a href="index.html" class="nav-back"><i class="fa-solid fa-chevron-left"></i></a>
            <div class="logo">Mico<span>Fix.</span></div>
            <h1 class="title">Welcome Back !</h1>
        </header>

        <main>
            <main>
                <img src="assets/eng2.jpg" alt="Login Illustration" class="illustration-hero">

                <form id="loginForm">
                    <div class="form-group">
                        <label class="label">Staff Name or ID</label>
                        <input type="text" id="username" class="input" placeholder="e.g. Ahmed Salimi" required>
                    </div>

                    <div class="form-group">
                        <label class="label">Password (Telephone)</label>
                        <input type="password" id="password" class="input" placeholder="••••••••" required>
                    </div>

                    <div class="login-options"
                        style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; font-size: 14px;">
                        <label class="checkbox-group">
                            <input type="checkbox" id="rememberMe" checked>
                            <span>Remember me</span>
                        </label>
                        <a href="#" class="link" id="forgotPassBtn">Forgot Password?</a>
                    </div>

                    <button type="submit" class="btn btn-primary" id="loginBtn">
                        Login <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </form>
            </main>

    </div>

    <!-- Forgot Password Modal -->
    <div class="modal-overlay" id="forgotPassModal">
        <div class="modal-content">
            <div class="modal-icon">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <h3 class="modal-title">Reset Password</h3>
            <p class="modal-desc">Forgot your password? No problem. Click the button below to send a request to the
                administrator to reset your password.</p>
            <button class="btn btn-primary" id="sendResetReq">
                Send request to admin <i class="fa-solid fa-paper-plane"></i>
            </button>
            <button class="btn ghost-btn" id="closeModal">
                Cancel
            </button>
        </div>
    </div>

    <script src="mobileappAuth.js"></script>
    <script src="auth.js"></script>
    <script>
        const modal = document.getElementById('forgotPassModal');
        const forgotBtn = document.getElementById('forgotPassBtn');
        const closeBtn = document.getElementById('closeModal');
        const sendBtn = document.getElementById('sendResetReq');

        forgotBtn.onclick = (e) => {
            e.preventDefault();
            modal.style.display = 'flex';
        }

        closeBtn.onclick = () => modal.style.display = 'none';

        sendBtn.onclick = () => {
            alert('Your request has been sent to the administrator. Please wait for approval.');
            modal.style.display = 'none';
        }

        window.onclick = (event) => {
            if (event.target == modal) {
                modal.style.display = "none";
            }
        }
    </script>
</body>

</html>
