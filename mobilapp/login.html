<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MicoFix - Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="container">
        <header>
            <a href="index.html" class="nav-back"><i class="fa-solid fa-chevron-left"></i></a>
            <div class="logo">Mico<span>Fix.</span></div>
            <h1 class="title">Welcome Back !</h1>
        </header>

        <main>
            <img src="assets/eng2.jpg" alt="Login Illustration" class="illustration-hero"
                style="max-height: 200px; margin: 20px 0;">

            <form id="loginForm">
                <div class="form-group">
                    <label class="label">Staff Name or ID</label>
                    <input type="text" id="username" class="input" placeholder="e.g. Ahmed Salimi" required>
                </div>

                <div class="form-group">
                    <label class="label">Password (Telephone)</label>
                    <input type="password" id="password" class="input" placeholder="••••••••" required>
                </div>

                <div class="form-footer">
                    <label class="checkbox-group">
                        <input type="checkbox" checked>
                        <span>Remember me</span>
                    </label>
                    <a href="#" class="link">Forgot Password?</a>
                </div>

                <button type="submit" class="btn btn-primary" id="loginBtn">
                    Login <i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>
        </main>

        <footer class="footer-text">
            Don't have an account? <a href="#" class="link-highlight">Contact Admin</a>
        </footer>
    </div>

    <script src="mobileappAuth.js"></script>
    <script src="auth.js"></script>
</body>

</html>
