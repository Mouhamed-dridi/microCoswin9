<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MicoFix - Scheduling</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body style="background-color: var(--bg-alt);">
    <div class="header-curved" style="background-color: var(--primary); padding-bottom: 80px;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <a href="dashboard.html" style="color: white; font-size: 20px;"><i class="fa-solid fa-chevron-left"></i></a>
            <h1 class="title" style="font-size: 20px; color: white;">Maintenance</h1>
            <div class="filter-badge" style="background: rgba(255,255,255,0.2); color: white; padding: 10px;"><i
                    class="fa-solid fa-plus"></i></div>
        </div>
    </div>

    <div style="padding: 24px; margin-top: -30px;">
        <!-- Calendar Hero Strip -->
        <div class="task-card" style="margin-bottom: 24px; text-align: center;">
            <div style="display: flex; justify-content: space-between; margin-bottom: 16px; font-weight: 700;">
                <i class="fa-solid fa-chevron-left" style="color: #CCC;"></i>
                <span>March 2026</span>
                <i class="fa-solid fa-chevron-right" style="color: #CCC;"></i>
            </div>
            <div style="display: flex; justify-content: space-between;">
                <div style="display: flex; flex-direction: column; gap: 8px;">
                    <span style="font-size: 12px; color: var(--text-muted);">M</span>
                    <span
                        style="width: 35px; height: 35px; display: flex; align-items: center; justify-content: center; font-weight: 700;">1</span>
                </div>
                <div style="display: flex; flex-direction: column; gap: 8px;">
                    <span style="font-size: 12px; color: var(--text-muted);">T</span>
                    <span
                        style="width: 35px; height: 35px; display: flex; align-items: center; justify-content: center; font-weight: 700;">2</span>
                </div>
                <div style="display: flex; flex-direction: column; gap: 8px;">
                    <span style="font-size: 12px; color: var(--text-muted);">W</span>
                    <span
                        style="width: 35px; height: 35px; display: flex; align-items: center; justify-content: center; font-weight: 700;">3</span>
                </div>
                <div style="display: flex; flex-direction: column; gap: 8px;">
                    <span style="font-size: 12px; color: var(--text-muted);">T</span>
                    <span
                        style="width: 35px; height: 35px; background: var(--text); color: white; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-weight: 700;">4</span>
                </div>
                <div style="display: flex; flex-direction: column; gap: 8px;">
                    <span style="font-size: 12px; color: var(--text-muted);">F</span>
                    <span
                        style="width: 35px; height: 35px; display: flex; align-items: center; justify-content: center; font-weight: 700;">5</span>
                </div>
            </div>
        </div>

        <h3 style="margin: 0 0 16px 0; font-weight: 800;">Upcoming Repairs</h3>

        <div class="task-list" id="schedulingList">
            <!-- Populated by JS -->
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="dashboard.html" class="nav-item"><i class="fa-solid fa-grip"></i></a>
        <a href="scheduling.html" class="nav-item active"><i class="fa-solid fa-calendar-days"></i></a>
        <a href="settings.html" class="nav-item"><i class="fa-solid fa-gear"></i></a>
        <a href="profile.html" class="nav-item"><i class="fa-solid fa-user"></i></a>
    </nav>

    <script src="settingsManager.js"></script>
    <script src="dataManager.js"></script>
    <script>
        async function loadScheduledTasks() {
            const user = DataManager.getUserProfile();
            if (!user) { window.location.href = 'login.html'; return; }

            const tickets = await DataManager.getDashboardData(); // Fetch all tickets as requested
            const list = document.getElementById('schedulingList');

            // Show only future or recent tasks in scheduling view
            list.innerHTML = tickets.map(ticket => `
                <div class="task-card" style="margin-bottom: 12px;">
                    <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px;">
                        <span class="task-tag todo">Scheduled</span>
                        <i class="fa-solid fa-ellipsis-vertical" style="color: #CCC;"></i>
                    </div>
                    <h3 class="task-title" style="font-size: 16px;">Maintenance Service #${ticket.id.substring(ticket.id.length - 4)}</h3>
                    <div class="task-meta">
                        <div><i class="fa-solid fa-robot"></i> ${ticket.machine.nameOrCode}</div>
                        <div><i class="fa-solid fa-location-dot"></i> ${ticket.machine.location}</div>
                    </div>
                </div>
            `).join('');
        }
        document.addEventListener('DOMContentLoaded', loadScheduledTasks);
    </script>
</body>

</html>
