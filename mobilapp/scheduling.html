<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MicoFix - Scheduling</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body style="background-color: var(--bg-alt);">
    <div class="header-curved scheduling-header">
        <div class="header-top">
            <a href="dashboard.html" class="back-link"><i class="fa-solid fa-chevron-left"></i></a>
            <div class="header-actions">
                <!-- No actions -->
            </div>
        </div>
        <h1 class="title">Maintenance</h1>
    </div>

    <div class="scheduling-content">
        <h3 class="section-title-large">Upcoming Repairs</h3>

        <div class="task-list" id="schedulingList">
            <!-- Populated by JS -->
        </div>
    </div>

    <!-- Task Details Modal -->
    <div id="taskDetailModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">Maintenance Info</h3>
                <i id="closeTaskDetail" class="fa-solid fa-xmark close-icon"></i>
            </div>
            <div class="notif-list" id="taskDetailContent">
                <!-- Data will be populated here -->
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="dashboard.html" class="nav-item"><i class="fa-solid fa-grip"></i></a>
        <a href="scheduling.html" class="nav-item active"><i class="fa-solid fa-calendar-days"></i></a>
        <a href="settings.html" class="nav-item"><i class="fa-solid fa-gear"></i></a>
        <a href="profile.html" class="nav-item"><i class="fa-solid fa-user"></i></a>
    </nav>

    <script src="settingsManager.js"></script>
    <script src="dataManager.js"></script>
    <script>
        async function loadScheduledTasks() {
            const user = DataManager.getUserProfile();
            if (!user) { window.location.href = 'login.html'; return; }

            const tickets = await DataManager.getDashboardData();
            const list = document.getElementById('schedulingList');
            const modal = document.getElementById('taskDetailModal');
            const content = document.getElementById('taskDetailContent');
            const closeBtn = document.getElementById('closeTaskDetail');

            closeBtn.onclick = () => modal.classList.remove('active');
            window.onclick = (e) => { if (e.target === modal) modal.classList.remove('active'); };

            list.innerHTML = tickets.map(ticket => `
                <div class="task-card" onclick="showTaskDetails('${ticket.id}')">
                    <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px;">
                        <span class="task-tag todo">Scheduled</span>
                        <i class="fa-solid fa-ellipsis-vertical" style="color: #CCC;"></i>
                    </div>
                    <h3 class="task-title" style="font-size: 16px;">Maintenance Service #${ticket.id.substring(ticket.id.length - 4)}</h3>
                    <div class="task-meta">
                        <div><i class="fa-solid fa-gear"></i> ${ticket.machine.nameOrCode}</div>
                        <div><i class="fa-solid fa-location-dot"></i> ${ticket.machine.location}</div>
                    </div>
                </div>
            `).join('');

            window.showTaskDetails = (ticketId) => {
                const ticket = tickets.find(t => t.id === ticketId);
                if (!ticket) return;

                content.innerHTML = `
                    <div class="notif-item">
                        <p class="notif-title"><i class="fa-solid fa-screwdriver-wrench"></i> Maintenance Process</p>
                        <p class="notif-desc">Initiating full diagnostic on <strong>${ticket.machine.nameOrCode}</strong>. 
                        Checking hydraulics, electrical systems, and mechanical wear.</p>
                    </div>
                    <div class="notif-item">
                        <p class="notif-title"><i class="fa-solid fa-clock"></i> Schedule</p>
                        <p class="notif-desc">${ticket.date} at ${ticket.time}</p>
                    </div>
                    <div class="notif-item">
                        <p class="notif-title"><i class="fa-solid fa-location-dot"></i> Location</p>
                        <p class="notif-desc">${ticket.machine.location}</p>
                    </div>
                `;
                modal.classList.add('active');
            };
        }
        document.addEventListener('DOMContentLoaded', loadScheduledTasks);
    </script>
</body>

</html>
